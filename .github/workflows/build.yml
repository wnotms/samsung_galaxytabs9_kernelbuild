name: Build Galaxy Tab S9 SM-X710 Kernel

on:
  workflow_dispatch:
    inputs:
      lto:
        description: "LTO 模式"
        required: true
        type: choice
        options:
          - thin
          - full
        default: thin
      jobs:
        description: "并行编译线程数（GitHub Runner 建议 2）"
        required: true
        type: choice
        options:
          - '2'
          - '3'
          - '4'
        default: '2'
      build_number:
        description: "Samsung firmware build number"
        required: true
        type: string
        default: "X710ZCU5CYH4"

permissions:
  contents: read

jobs:
  build:
    name: SM-X710 / Android 13 / Linux 5.15
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      TARGET_DEFCONFIG: kalama_gki_defconfig
      LTO: ${{ inputs.lto }}
      JOBS: ${{ inputs.jobs }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      KBUILD_BUILD_TIMESTAMP: "2025-08-20 08:06:12 UTC"

    steps:
      - name: "🚀 Maximize Build Space | 最大化构建空间"
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 4096
          swap-size-mb: 12288
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: "📦 Install Git LFS | 安装 Git LFS"
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install --skip-repo
          git lfs version

      - name: "📥 Checkout Source | 检出源码"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: "📥 Pull LFS Toolchain | 下载 LFS 工具链"
        shell: bash
        run: |
          set -euo pipefail
          git lfs install
          git lfs pull
          git lfs checkout

      - name: "📦 Install Dependencies | 安装依赖"
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: git git-lfs zip build-essential xz-utils bison flex libz-dev libssl-dev libelf-dev bc cpio python3 pahole lld llvm ccache
          execute_install_scripts: true

      - name: "🔐 Configure Git | 配置 Git"
        run: |
          git config --global user.name "build"
          git config --global user.email "3379524839@qq.com"

      - name: "🔎 Verify Toolchain & Source | 检查工具链与源码"
        shell: bash
        run: |
          set -euo pipefail

          CLANG="$GITHUB_WORKSPACE/prebuilts/clang/host/linux-x86/clang-r450784e/bin/clang"
          PAHOLE="$GITHUB_WORKSPACE/prebuilts/kernel-build-tools/linux-x86/bin/pahole"
          DEFCONFIG="$GITHUB_WORKSPACE/common/arch/arm64/configs/kalama_gki_defconfig"

          test -d "$GITHUB_WORKSPACE/common"
          test -f "$CLANG"
          test -f "$PAHOLE"
          test -f "$DEFCONFIG"

          if head -n 1 "$CLANG" | grep -q "git-lfs"; then
            echo "::error::clang 仍然是 Git LFS pointer，LFS 文件未正确下载"
            exit 1
          fi

          if head -n 1 "$PAHOLE" | grep -q "git-lfs"; then
            echo "::error::pahole 仍然是 Git LFS pointer，LFS 文件未正确下载"
            exit 1
          fi

          chmod +x "$CLANG" "$PAHOLE"

          echo "========== clang =========="
          "$CLANG" --version

          echo "========== pahole =========="
          "$PAHOLE" --version

          echo "========== file info =========="
          file "$CLANG"
          file "$PAHOLE"

          echo "✅ SM-X710 kernel source and prebuilt toolchain OK"

      - name: "🔨 Build Kernel | 编译内核"
        shell: bash
        run: |
          chmod +x "$GITHUB_WORKSPACE/scripts/build_sm_x710.sh"
          "$GITHUB_WORKSPACE/scripts/build_sm_x710.sh"

      - name: "✅ Verify Kernel | 验证内核"
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$GITHUB_WORKSPACE/common/out/arch/arm64/boot/Image"
          CONFIG="$GITHUB_WORKSPACE/common/out/.config"

          test -s "$IMAGE"
          test -f "$CONFIG"

          for key in \
            CONFIG_SYSVIPC \
            CONFIG_POSIX_MQUEUE \
            CONFIG_NAMESPACES \
            CONFIG_PID_NS \
            CONFIG_UTS_NS \
            CONFIG_IPC_NS \
            CONFIG_USER_NS \
            CONFIG_NET_NS \
            CONFIG_SECCOMP \
            CONFIG_SECCOMP_FILTER \
            CONFIG_CGROUPS \
            CONFIG_DEVTMPFS \
            CONFIG_OVERLAY_FS \
            CONFIG_VETH \
            CONFIG_BRIDGE; do
              if ! grep -q "^${key}=y$" "$CONFIG"; then
                echo "::error::${key} is not enabled"
                exit 1
              fi
              echo "✅ ${key}=y"
          done

          echo "Kernel image: $(du -h "$IMAGE" | cut -f1)"

      - name: "📤 Upload AnyKernel3 | 上传刷机包"
        uses: actions/upload-artifact@v7
        with:
          name: GalaxyTabS9_SM-X710_${{ inputs.build_number }}_${{ inputs.lto }}LTO
          path: |
            common/out/AnyKernel3/*.zip
            common/out/arch/arm64/boot/Image
            common/out/.config
          if-no-files-found: error
          compression-level: 6
